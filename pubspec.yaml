name: vida_app
description: VIDA — App espiritual cristiana con versículos, racha, estudio bíblico y más.
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  shared_preferences: ^2.5.5
  home_widget: ^0.7.0
  webview_flutter: ^4.10.0
  connectivity_plus: ^6.0.3
  share_plus: ^10.0.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600

  assets:
    - contra_img/
    - gallery/
    - widget-fav.png