<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#f0fdf4"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Quiz Bíblico</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  :root {
    --bg: #f0fdf4;
    --surface: #ffffff;
    --surface2: #f0fdf4;
    --border: #d1fae5;
    --border2: #a7f3d0;
    --em: #059669;
    --em-dark: #047857;
    --em-light: #ecfdf5;
    --em-xlight: #f0fdf4;
    --text: #064e3b;
    --text2: #065f46;
    --text3: #6b7280;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --green: #059669;
    --green-bg: #ecfdf5;
    --radius: 14px;
  }

  html {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 1rem 5rem;
    overflow-x: hidden;
  }

  /* ── HEADER MÍNIMO ─────────────────────────────── */
  .header {
    width: 100%; max-width: 480px;
    text-align: center;
    padding: 1.6rem 1rem 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
  }
  .header-cross {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    background: var(--em);
    color: white;
    border-radius: 10px;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--text);
  }
  .header-title span { color: var(--em); }

  /* ── SCREENS ─────────────────────────────────────── */
  .screen { width: 100%; max-width: 480px; display: none; }
  .screen.active { display: block; }

  /* ── HOME ────────────────────────────────────────── */
  .home-intro {
    background: var(--em-light);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .9rem 1.1rem;
    margin-bottom: 1.2rem;
    font-size: .9rem;
    line-height: 1.65;
    color: var(--text2);
    text-align: center;
  }
  .home-intro strong { color: var(--em-dark); font-weight: 600; }

  .category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .55rem;
    margin-bottom: 1.2rem;
  }

  .cat-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: .85rem .9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: .6rem;
    min-height: 60px;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  .cat-card:active {
    transform: scale(.97);
    background: var(--em-light);
    border-color: var(--em);
  }
  .cat-card.selected {
    border-color: var(--em);
    background: var(--em-light);
  }
  .cat-card.selected .cat-icon { background: var(--em); }

  .cat-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    transition: background .15s;
  }
  .cat-info { flex: 1; min-width: 0; }
  .cat-name {
    font-size: .82rem; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cat-count { font-size: .72rem; color: var(--text3); margin-top: .1rem; }

  .diff-section-label {
    font-size: .72rem;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: .5rem;
  }

  .difficulty-row {
    display: flex; gap: .4rem; margin-bottom: 1.2rem;
  }
  .diff-btn {
    flex: 1;
    padding: .7rem .3rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-family: 'DM Sans', sans-serif;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--text2);
    text-align: center;
    line-height: 1.3;
    min-height: 52px;
    transition: border-color .15s, background .15s, color .15s;
    user-select: none;
    -webkit-user-select: none;
  }
  .diff-btn:active {
    background: var(--em-light);
    border-color: var(--em);
  }
  .diff-btn.selected {
    background: var(--em); color: white; border-color: var(--em);
  }
  .diff-label { font-size: .68rem; display: block; opacity: .75; font-weight: 400; }

  #questionCount {
    font-size: .85rem;
    color: var(--text3);
    font-style: italic;
    text-align: center;
    margin-bottom: .9rem;
  }

  .btn-start {
    width: 100%;
    padding: 1rem;
    background: var(--em);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: .01em;
    transition: background .15s, transform .1s;
    min-height: 54px;
    user-select: none;
  }
  .btn-start:active { background: var(--em-dark); transform: scale(.98); }
  .btn-start:disabled { background: var(--text3); cursor: default; }

  /* ── QUIZ ─────────────────────────────────────────── */
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: .7rem;
  }
  .quiz-cat-label {
    font-size: .78rem;
    font-weight: 500;
    color: var(--em-dark);
    background: var(--em-light);
    padding: .28rem .75rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 55%;
  }
  .quiz-counter {
    font-size: .82rem;
    font-weight: 500;
    color: var(--text3);
  }
  .quiz-counter span { color: var(--em); font-weight: 700; }

  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    margin-bottom: .85rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--em);
    border-radius: 3px;
    transition: width .4s ease;
  }

  .score-live {
    display: flex; gap: .5rem; margin-bottom: .85rem;
  }
  .score-chip {
    flex: 1;
    display: flex; align-items: center; gap: .45rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .5rem .9rem;
    font-size: .85rem;
    color: var(--text3);
    min-height: 42px;
  }
  .score-chip .chip-n { font-size: 1.1rem; font-weight: 700; }
  .score-chip.correct .chip-n { color: var(--green); }
  .score-chip.wrong .chip-n { color: var(--red); }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.3rem 1.1rem 1rem;
    margin-bottom: .85rem;
  }
  .question-ref {
    font-size: .72rem;
    font-weight: 600;
    color: var(--em);
    margin-bottom: .5rem;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .question-text {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem;
    line-height: 1.5;
    color: var(--text);
    font-weight: 400;
  }

  .options-grid {
    display: grid;
    gap: .55rem;
  }
  .opt-btn {
    width: 100%;
    text-align: left;
    padding: .9rem 1rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: .93rem;
    font-weight: 400;
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; gap: .75rem;
    min-height: 52px;
    transition: border-color .12s, background .12s;
    user-select: none;
    -webkit-user-select: none;
  }
  .opt-btn:active:not(:disabled) {
    border-color: var(--em);
    background: var(--em-xlight);
    transform: scale(.99);
  }
  .opt-btn .opt-letter {
    width: 28px; height: 28px; border-radius: 7px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: .78rem;
    font-weight: 700;
    color: var(--text3);
    flex-shrink: 0;
  }
  .opt-btn.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
  .opt-btn.correct .opt-letter { background: var(--green); color: white; }
  .opt-btn.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
  .opt-btn.wrong .opt-letter { background: var(--red); color: white; }
  .opt-btn.reveal { border-color: var(--green); background: var(--green-bg); color: var(--green); }
  .opt-btn.reveal .opt-letter { background: var(--green); color: white; }
  .opt-btn:disabled { cursor: default; }

  .explanation-box {
    background: var(--em-light);
    border: 1px solid var(--border);
    border-left: 3px solid var(--em);
    border-radius: 0 10px 10px 0;
    padding: .85rem 1rem;
    margin-top: .7rem;
    font-size: .88rem;
    line-height: 1.6;
    color: var(--text2);
    display: none;
  }
  .explanation-box.show { display: block; }

  .quiz-actions {
    display: flex; gap: .55rem; margin-top: .9rem;
  }
  .btn-next, .btn-skip {
    padding: .8rem 1rem;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    min-height: 50px;
    transition: all .12s;
    user-select: none;
  }
  .btn-next {
    flex: 1;
    background: var(--em);
    color: white;
  }
  .btn-next:active { background: var(--em-dark); transform: scale(.98); }
  .btn-skip {
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--text3);
    font-weight: 500;
    padding-left: 1.1rem;
    padding-right: 1.1rem;
  }
  .btn-skip:active { border-color: var(--em); color: var(--em); }

  /* ── TIMER ───────────────────────────────────────── */
  .timer-ring {
    position: relative;
    width: 44px; height: 44px;
    flex-shrink: 0;
  }
  .timer-ring svg { transform: rotate(-90deg); }
  .timer-ring circle { fill: none; }
  .timer-ring .bg { stroke: var(--border); stroke-width: 3.5; }
  .timer-ring .fg {
    stroke: var(--em); stroke-width: 3.5; stroke-linecap: round;
    transition: stroke-dashoffset .9s linear, stroke .5s;
  }
  .timer-ring .num {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .78rem;
    font-weight: 700;
    color: var(--text);
  }

  /* ── RESULTS ─────────────────────────────────────── */
  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.6rem 1.2rem;
    margin-bottom: 1.1rem;
    text-align: center;
  }
  .results-trophy { font-size: 2.8rem; margin-bottom: .5rem; }
  .results-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.55rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: .3rem;
  }
  .results-verse {
    color: var(--text3);
    font-size: .87rem;
    line-height: 1.65;
    margin-bottom: 1.3rem;
    font-style: italic;
  }
  .results-verse strong { color: var(--em); font-style: normal; font-weight: 600; }

  .results-stats {
    display: flex; gap: .55rem; justify-content: center; margin-bottom: 1.3rem;
  }
  .stat-box {
    flex: 1;
    background: var(--surface2);
    border-radius: 12px;
    padding: .9rem .5rem;
    border: 1px solid var(--border);
  }
  .stat-n {
    font-family: 'DM Serif Display', serif;
    font-size: 1.9rem;
    font-weight: 400;
    line-height: 1;
    margin-bottom: .2rem;
  }
  .stat-n.good { color: var(--green); }
  .stat-n.bad { color: var(--red); }
  .stat-n.pct { color: var(--em); }
  .stat-label { font-size: .72rem; color: var(--text3); font-weight: 500; }

  .score-bar-wrap { margin: .9rem 0; }
  .score-bar-bg {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: .35rem;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--em);
    transition: width 1s ease .3s;
  }
  .score-bar-label { font-size: .78rem; color: var(--text3); }

  .results-actions { display: flex; flex-direction: column; gap: .55rem; }
  .btn-restart {
    width: 100%;
    padding: .9rem;
    background: var(--em);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 52px;
    transition: background .12s, transform .1s;
    user-select: none;
  }
  .btn-restart:active { background: var(--em-dark); transform: scale(.98); }

  .btn-home {
    width: 100%;
    padding: .8rem;
    background: var(--surface);
    color: var(--text2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: .93rem;
    font-weight: 500;
    cursor: pointer;
    min-height: 50px;
    transition: border-color .12s;
    user-select: none;
  }
  .btn-home:active { border-color: var(--em); color: var(--em); }

  /* ── REVIEW ─────────────────────────────────────── */
  .review-section { margin-top: 1.1rem; }
  .review-title {
    font-size: .85rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: .65rem;
    padding-bottom: .5rem;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .85rem 1rem;
    margin-bottom: .45rem;
  }
  .review-item.ok { border-left: 3px solid var(--green); }
  .review-item.fail { border-left: 3px solid var(--red); }
  .review-q { font-size: .87rem; color: var(--text); margin-bottom: .25rem; font-weight: 500; }
  .review-a { font-size: .81rem; color: var(--text3); }
  .review-a span { font-weight: 600; }
  .review-a.correct span { color: var(--green); }
  .review-a.wrong span { color: var(--red); }

  /* ── OFFLINE ─────────────────────────────────────── */
  .offline-badge {
    position: fixed; bottom: 1rem; right: 1rem;
    background: var(--em);
    color: white;
    font-size: .72rem;
    font-weight: 600;
    padding: .35rem .8rem;
    border-radius: 20px;
    display: none;
    align-items: center; gap: .4rem;
    z-index: 100;
  }
  .offline-badge.show { display: flex; }

  /* ── ANIMACIONES ─────────────────────────────────── */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  .question-card { animation: slideUp .22s ease; }
  .opt-btn { animation: slideUp .2s ease both; }
  .opt-btn:nth-child(1) { animation-delay: .04s; }
  .opt-btn:nth-child(2) { animation-delay: .08s; }
  .opt-btn:nth-child(3) { animation-delay: .12s; }
  .opt-btn:nth-child(4) { animation-delay: .16s; }

  /* ── SAFE AREA (iPhone notch) ───────────────────── */
  body {
    padding-bottom: calc(5rem + env(safe-area-inset-bottom));
  }
</style>
</head>
<body>

<br>
<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
  <div class="home-intro">
    Selecciona una <strong>categoría</strong> y nivel de <strong>dificultad</strong>,<br/>
    luego comienza el quiz. Las preguntas se mezclarán aleatoriamente.
  </div>

  <div class="category-grid" id="categoryGrid"></div>

  <div style="margin-bottom:.8rem;">
    <div class="diff-section-label">Dificultad</div>
    <div class="difficulty-row">
      <button class="diff-btn selected" data-diff="all">Todas <span class="diff-label">Mezcladas</span></button>
      <button class="diff-btn" data-diff="easy">Fácil <span class="diff-label">Básicas</span></button>
      <button class="diff-btn" data-diff="medium">Medio <span class="diff-label">Intermedias</span></button>
      <button class="diff-btn" data-diff="hard">Difícil <span class="diff-label">Avanzadas</span></button>
    </div>
  </div>

  <div id="questionCount"></div>
  <button class="btn-start" id="btnStart">Comenzar Quiz ✦</button>
</div>

<!-- QUIZ SCREEN -->
<div id="quizScreen" class="screen">
  <div class="quiz-meta">
    <div class="quiz-cat-label" id="quizCatLabel"></div>
    <div style="display:flex;align-items:center;gap:.7rem;">
      <div class="quiz-counter">Preg. <span id="qNum">1</span>/<span id="qTotal">10</span></div>
      <div class="timer-ring" id="timerRing">
        <svg width="44" height="44" viewBox="0 0 46 46">
          <circle class="bg" cx="23" cy="23" r="19"/>
          <circle class="fg" id="timerCircle" cx="23" cy="23" r="19"
            stroke-dasharray="119.4" stroke-dashoffset="0"/>
        </svg>
        <div class="num" id="timerNum">20</div>
      </div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <div class="score-live">
    <div class="score-chip correct">✓ <span class="chip-n" id="liveCorrect">0</span> correctas</div>
    <div class="score-chip wrong">✗ <span class="chip-n" id="liveWrong">0</span> incorrectas</div>
  </div>

  <div class="question-card" id="questionCard">
    <div class="question-ref" id="qRef"></div>
    <div class="question-text" id="qText"></div>
  </div>

  <div class="options-grid" id="optionsGrid"></div>
  <div class="explanation-box" id="explanationBox"></div>

  <div class="quiz-actions">
    <button class="btn-skip" id="btnSkip">Saltar →</button>
    <button class="btn-next" id="btnNext" style="display:none">Siguiente →</button>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div id="resultsScreen" class="screen">
  <div class="results-card">
    <div class="results-trophy" id="resTrophy">🏆</div>
    <div class="results-title" id="resTitle">¡Excelente!</div>
    <div class="results-verse" id="resVerse"></div>

    <div class="results-stats">
      <div class="stat-box">
        <div class="stat-n good" id="resCorrect">0</div>
        <div class="stat-label">Correctas</div>
      </div>
      <div class="stat-box">
        <div class="stat-n bad" id="resWrong">0</div>
        <div class="stat-label">Incorrectas</div>
      </div>
      <div class="stat-box">
        <div class="stat-n pct" id="resPct">0%</div>
        <div class="stat-label">Puntaje</div>
      </div>
    </div>

    <div class="score-bar-wrap">
      <div class="score-bar-bg"><div class="score-bar-fill" id="scoreBar" style="width:0%"></div></div>
      <div class="score-bar-label" id="scoreBarLabel"></div>
    </div>

    <div class="results-actions">
      <button class="btn-restart" id="btnRestart">Jugar de nuevo ✦</button>
      <button class="btn-home" id="btnHome">← Cambiar categoría</button>
    </div>
  </div>

  <div class="review-section" id="reviewSection">
    <div class="review-title">📖 Revisión de respuestas</div>
    <div id="reviewList"></div>
  </div>
</div>

<div class="offline-badge" id="offlineBadge">⚡ Sin conexión</div>

<script>
// ═══════════════════════════════════════════════
//  BANCO DE PREGUNTAS
// ═══════════════════════════════════════════════
const CATEGORIES = [
  { id:'genesis',    name:'Génesis y Creación',  icon:'🌍' },
  { id:'exodo',      name:'Éxodo y Ley',          icon:'📜' },
  { id:'historia',   name:'Historia de Israel',   icon:'⚔️' },
  { id:'poesia',     name:'Salmos y Poesía',       icon:'🎵' },
  { id:'profetas',   name:'Los Profetas',          icon:'🔥' },
  { id:'evangelios', name:'Los Evangelios',        icon:'✝️' },
  { id:'hechos',     name:'Hechos y Cartas',       icon:'✉️' },
  { id:'general',    name:'General',               icon:'📖' },
];

const ALL_QUESTIONS = [
// ── GÉNESIS / CREACIÓN
{ cat:'genesis', diff:'easy', ref:'Génesis 1',

//  ESTADO
// ═══════════════════════════════════════════════
let state = {
  selectedCats: [], difficulty: 'all',
  questions: [], current: 0,
  correct: 0, wrong: 0,
  answered: false, results: [],
  timerInterval: null, timerSec: 20,
};

// ═══════════════════════════════════════════════
//  UTILIDADES
// ═══════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function $(id) { return document.getElementById(id); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ═══════════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════════
function buildHome() {
  const grid = $('categoryGrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const count = ALL_QUESTIONS.filter(q => q.cat === cat.id).length;
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.dataset.id = cat.id;
    card.innerHTML = `
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-info">
        <div class="cat-name">${cat.name}</div>
        <div class="cat-count">${count} preguntas</div>
      </div>`;
    card.addEventListener('click', () => toggleCat(cat.id, card));
    grid.appendChild(card);
  });
  updateStartBtn();
}

function toggleCat(id, card) {
  const idx = state.selectedCats.indexOf(id);
  if (idx === -1) { state.selectedCats.push(id); card.classList.add('selected'); }
  else { state.selectedCats.splice(idx, 1); card.classList.remove('selected'); }
  updateStartBtn();
}

function updateStartBtn() {
  const pool = getPool();
  $('questionCount').textContent = pool.length > 0
    ? `${pool.length} pregunta${pool.length !== 1 ? 's' : ''} disponible${pool.length !== 1 ? 's' : ''}`
    : 'Selecciona al menos una categoría';
  $('btnStart').disabled = pool.length === 0;
}

function getPool() {
  let pool = state.selectedCats.length === 0 ? ALL_QUESTIONS
    : ALL_QUESTIONS.filter(q => state.selectedCats.includes(q.cat));
  if (state.difficulty !== 'all') pool = pool.filter(q => q.diff === state.difficulty);
  return pool;
}

// ═══════════════════════════════════════════════
//  DIFFICULTY BUTTONS
// ═══════════════════════════════════════════════
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    state.difficulty = btn.dataset.diff;
    updateStartBtn();
  });
});

// ═══════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════
$('btnStart').addEventListener('click', () => {
  const pool = getPool();
  state.questions = shuffle(pool).slice(0, Math.min(pool.length, 20));
  state.current = 0; state.correct = 0; state.wrong = 0; state.results = [];
  showScreen('quizScreen');
  renderQuestion();
});

// ═══════════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════════
const CIRCUMFERENCE = 2 * Math.PI * 19;

function startTimer() {
  stopTimer();
  state.timerSec = 20;
  updateTimerUI(20);
  state.timerInterval = setInterval(() => {
    state.timerSec--;
    updateTimerUI(state.timerSec);
    if (state.timerSec <= 0) { stopTimer(); if (!state.answered) autoSkip(); }
  }, 1000);
}

function stopTimer() {
  clearInterval(state.timerInterval);
  state.timerInterval = null;
}

function updateTimerUI(sec) {
  $('timerNum').textContent = sec;
  const circle = $('timerCircle');
  const offset = CIRCUMFERENCE * (1 - sec / 20);
  circle.style.strokeDashoffset = offset;
  if (sec <= 5) {
    circle.style.stroke = '#dc2626';
    $('timerNum').style.color = '#dc2626';
  } else if (sec <= 10) {
    circle.style.stroke = '#f59e0b';
    $('timerNum').style.color = '#d97706';
  } else {
    circle.style.stroke = '#059669';
    $('timerNum').style.color = '#064e3b';
  }
}

function autoSkip() {
  if (state.answered) return;
  state.answered = true;
  const q = state.questions[state.current];
  const opts = $('optionsGrid').querySelectorAll('.opt-btn');
  opts.forEach(b => { b.disabled = true; });
  opts[q.ans].classList.add('reveal');
  state.results.push({ q, userAns: -1, correct: false });
  state.wrong++;
  updateLiveScore();
  $('explanationBox').textContent = '⏱ Tiempo agotado. ' + q.exp;
  $('explanationBox').classList.add('show');
  $('btnSkip').style.display = 'none';
  $('btnNext').style.display = 'block';
}

// ═══════════════════════════════════════════════
//  RENDER QUESTION
// ═══════════════════════════════════════════════
function renderQuestion() {
  state.answered = false;
  const q = state.questions[state.current];
  const total = state.questions.length;

  $('qNum').textContent = state.current + 1;
  $('qTotal').textContent = total;
  $('progressFill').style.width = `${(state.current / total) * 100}%`;
  $('qText').textContent = q.q;

  const catObj = CATEGORIES.find(c => c.id === q.cat);
  $('quizCatLabel').textContent = catObj ? `${catObj.icon} ${catObj.name}` : q.cat;

  const diffMap = { easy: '⭐', medium: '⭐⭐', hard: '⭐⭐⭐' };
  $('qRef').textContent = `${q.ref} · ${diffMap[q.diff] || ''}`;

  $('explanationBox').classList.remove('show');
  $('explanationBox').textContent = '';
  $('btnNext').style.display = 'none';
  $('btnSkip').style.display = 'block';

  const grid = $('optionsGrid');
  grid.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => answer(i));
    grid.appendChild(btn);
  });

  const card = $('questionCard');
  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = ''; });

  startTimer();
}

// ═══════════════════════════════════════════════
//  ANSWER
// ═══════════════════════════════════════════════
function answer(i) {
  if (state.answered) return;
  state.answered = true;
  stopTimer();

  const q = state.questions[state.current];
  const opts = $('optionsGrid').querySelectorAll('.opt-btn');
  const isCorrect = i === q.ans;

  opts.forEach(b => b.disabled = true);
  opts[q.ans].classList.add('correct');
  if (!isCorrect) opts[i].classList.add('wrong');

  if (isCorrect) state.correct++; else state.wrong++;
  state.results.push({ q, userAns: i, correct: isCorrect });
  updateLiveScore();

  $('explanationBox').textContent = (isCorrect ? '✓ ¡Correcto! ' : '✗ Incorrecto. ') + q.exp;
  $('explanationBox').classList.add('show');
  $('btnSkip').style.display = 'none';
  $('btnNext').style.display = 'block';
}

function updateLiveScore() {
  $('liveCorrect').textContent = state.correct;
  $('liveWrong').textContent = state.wrong;
}

// ═══════════════════════════════════════════════
//  NAVEGACIÓN
// ═══════════════════════════════════════════════
$('btnNext').addEventListener('click', () => {
  state.current++;
  if (state.current >= state.questions.length) showResults();
  else renderQuestion();
});

$('btnSkip').addEventListener('click', () => {
  stopTimer();
  if (!state.answered) {
    state.answered = true;
    const q = state.questions[state.current];
    const opts = $('optionsGrid').querySelectorAll('.opt-btn');
    opts.forEach(b => b.disabled = true);
    opts[q.ans].classList.add('reveal');
    state.results.push({ q, userAns: -1, correct: false });
    state.wrong++;
    updateLiveScore();
    $('explanationBox').textContent = 'Saltado. ' + q.exp;
    $('explanationBox').classList.add('show');
    $('btnSkip').style.display = 'none';
    $('btnNext').style.display = 'block';
  }
});

// ═══════════════════════════════════════════════
//  RESULTS
// ═══════════════════════════════════════════════
const VERSES = [
  { pct:[90,100], text:'"Todo lo puedo en Cristo que me fortalece." — Filipenses 4:13', trophy:'🏆', title:'¡Conocimiento extraordinario!' },
  { pct:[75,89],  text:'"Bienaventurado el que lee y los que oyen las palabras de esta profecía." — Apocalipsis 1:3', trophy:'🥇', title:'¡Excelente conocimiento!' },
  { pct:[55,74],  text:'"Lámpara es a mis pies tu palabra, y lumbrera a mi camino." — Salmo 119:105', trophy:'📖', title:'¡Buen conocimiento!' },
  { pct:[30,54],  text:'"Estudia para presentarte a Dios aprobado." — 2 Timoteo 2:15', trophy:'📚', title:'Sigue estudiando' },
  { pct:[0,29],   text:'"Escudriñad las Escrituras." — Juan 5:39', trophy:'🙏', title:'¡Sigue leyendo la Biblia!' },
];

function showResults() {
  stopTimer();
  const total = state.questions.length;
  const pct = Math.round((state.correct / total) * 100);
  const band = VERSES.find(v => pct >= v.pct[0] && pct <= v.pct[1]) || VERSES[4];

  $('resTrophy').textContent = band.trophy;
  $('resTitle').textContent = band.title;
  $('resVerse').innerHTML = band.text.replace('—', '<strong>—');
  $('resCorrect').textContent = state.correct;
  $('resWrong').textContent = state.wrong;
  $('resPct').textContent = pct + '%';
  $('scoreBarLabel').textContent = `${state.correct} de ${total} correctas`;
  setTimeout(() => { $('scoreBar').style.width = pct + '%'; }, 100);

  const list = $('reviewList');
  list.innerHTML = '';
  state.results.forEach(r => {
    const item = document.createElement('div');
    item.className = 'review-item ' + (r.correct ? 'ok' : 'fail');
    const userLabel = r.userAns === -1 ? 'Saltada' : r.q.opts[r.userAns];
    item.innerHTML = `
      <div class="review-q">${r.q.q}</div>
      <div class="review-a correct">Correcta: <span>${r.q.opts[r.q.ans]}</span></div>
      ${!r.correct ? `<div class="review-a wrong">Tu respuesta: <span>${userLabel}</span></div>` : ''}`;
    list.appendChild(item);
  });

  showScreen('resultsScreen');
}

$('btnRestart').addEventListener('click', () => {
  const pool = getPool();
  state.questions = shuffle(pool).slice(0, Math.min(pool.length, 20));
  state.current = 0; state.correct = 0; state.wrong = 0; state.results = [];
  $('liveCorrect').textContent = '0';
  $('liveWrong').textContent = '0';
  showScreen('quizScreen');
  renderQuestion();
});

$('btnHome').addEventListener('click', () => {
  stopTimer();
  showScreen('homeScreen');
});

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
buildHome();

if ('serviceWorker' in navigator) {
  window.addEventListener('online', () => $('offlineBadge').classList.remove('show'));
  window.addEventListener('offline', () => $('offlineBadge').classList.add('show'));
  if (!navigator.onLine) $('offlineBadge').classList.add('show');
}
</script>
</body>
</html>
